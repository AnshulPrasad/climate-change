<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Data Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        .app-container { display: flex; min-height: 100vh; }

        /* Drawer Sidebar */
        .sidebar { width: 260px; background-color: #1e293b; color: #fff; padding: 20px 0; }
        .sidebar h2 { padding: 0 20px 20px; font-size: 1.1rem; color: #94a3b8; border-bottom: 1px solid #334155; }
        .sidebar ul { list-style: none; margin-top: 10px; }
        .sidebar li a { display: block; padding: 12px 20px; color: #cbd5e1; text-decoration: none; font-size: 0.95rem; }
        .sidebar li a:hover, .sidebar li.active a { background-color: #334155; color: #fff; border-left: 4px solid #38bdf8; }

        /* Main Workspace */
        .workspace { flex: 1; padding: 30px; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h2>Data Sources</h2>
            <ul>
                <!-- Home Link -->
                <li class="{% if active_source == 'home' %}active{% endif %}">
                    <a href="?source=home">🏠 Home</a>
                </li>
                <hr style="border: 0; border-top: 1px solid #334155; margin: 10px 0;">

                <!-- Data Sources Links -->
                <li class="{% if active_source == 'copernicus' %}active{% endif %}"><a href="?source=copernicus">Copernicus</a></li>
                <li class="{% if active_source == 'earth_engine' %}active{% endif %}"><a href="?source=earth_engine">Google Earth Engine</a></li>
                <li class="{% if active_source == 'hugging_face' %}active{% endif %}"><a href="?source=hugging_face">Hugging Face</a></li>
                <li class="{% if active_source == 'nasa' %}active{% endif %}"><a href="?source=nasa">NASA</a></li>
                <li class="{% if active_source == 'noaa' %}active{% endif %}"><a href="?source=noaa">NOAA</a></li>
                <li class="{% if active_source == 'owid' %}active{% endif %}"><a href="?source=owid">Our World in Data</a></li>
                <li class="{% if active_source == 'world_bank' %}active{% endif %}"><a href="?source=world_bank">World Bank</a></li>
            </ul>
        </aside>

        <main class="workspace">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
