<style>
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label.field-label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: #334155;
    }
    /* Dropdown structural styling */
    .checkbox-dropdown {
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        background-color: #ffffff;
        padding: 8px;
        width: 100%;
        max-width: 300px;
    }
    .checkbox-dropdown summary {
        cursor: pointer;
        font-size: 0.95rem;
        color: #475569;
        list-style: none; /* Removes default disclosure triangle in supported browsers */
        outline: none;
    }
    /* Django UL override */
    .checkbox-dropdown ul {
        list-style: none;
        padding: 0;
        margin: 10px 0 0 0;
        max-height: 150px;
        overflow-y: auto;
        border-top: 1px solid #e2e8f0;
    }
    .checkbox-dropdown ul li {
        margin: 5px 0;
    }
    .checkbox-dropdown ul li label {
        display: flex;
        align-items: center;
        font-size: 0.9rem;
        color: #334155;
        cursor: pointer;
    }
    .checkbox-dropdown ul li input[type="checkbox"] {
        margin-right: 8px;
    }
    /* Standard input styling */
    .standard-input input, .standard-input select {
        width: 100%;
        max-width: 300px;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
    }
    .help-text {
        font-size: 0.8rem;
        color: #64748b;
        display: block;
        margin-top: 4px;
    }
</style>

<div class="copernicus-parameters">
    {% for field in form %}
        <div class="form-group">
            <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}</label>

            <!-- Corrected conditional utilizing Django's native widget_type property -->
            {% if field.widget_type == 'checkboxselectmultiple' %}
                <details class="checkbox-dropdown">
                    <summary>Select {{ field.label }}...</summary>
                    {{ field }}
                </details>
            {% else %}
                <div class="standard-input">
                    {{ field }}
                </div>
            {% endif %}

            {% if field.help_text %}
                <span class="help-text">{{ field.help_text }}</span>
            {% endif %}

            {% for error in field.errors %}
                <span style="color: #ef4444; font-size: 0.85rem; display: block; margin-top: 4px;">{{ error }}</span>
            {% endfor %}
        </div>
    {% endfor %}
</div>
