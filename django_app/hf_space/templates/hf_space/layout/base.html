<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Climate Data Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { min-height: 100vh; display: flex; margin: 0; background-color: #f8fafc; }
        .app-container { display: flex; width: 100%; min-height: 100vh; }

        /* Drawer Sidebar */
        .sidebar { width: 260px; background-color: #1e293b; color: #fff; padding: 20px 0; flex-shrink: 0; }
        .sidebar h2 { padding: 0 20px 20px; font-size: 1.1rem; color: #94a3b8; border-bottom: 1px solid #334155; }
        .sidebar ul { list-style: none; margin-top: 10px; }
        .sidebar li a { display: block; padding: 12px 20px; color: #cbd5e1; text-decoration: none; font-size: 0.95rem; }
        .sidebar li a:hover, .sidebar li.active a { background-color: #334155; color: #fff; border-left: 4px solid #38bdf8; }

        /* Main Workspace */
        .provider-workspace { flex: 1; padding: 30px; background-color: #f8fafc; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="app-container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
