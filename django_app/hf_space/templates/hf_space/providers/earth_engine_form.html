<div style="display: flex; flex-direction: column; gap: 15px;">
    {% for field in form %}
        <div>
            <label style="font-weight: 600; font-size: 0.9rem; color: #1e293b;">{{ field.label }}</label>
            <div style="margin-top: 5px;" class="ee-standard-input">
                {{ field }}
            </div>
        </div>
    {% endfor %}
</div>

<style>
    /* Styling to ensure inputs match the standard theme */
    .ee-standard-input input, .ee-standard-input select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
</style>
